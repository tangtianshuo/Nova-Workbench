<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Nova</title>
  </head>
  <body style="background:#F2F4F8">
    <div id="root">
      <!--
        ponytail: static boot splash. Visible during main.tsx top-level await
        (initializeDatabase on Tauri takes 1-3s for SQLite migration + seed).
        createRoot().render() replaces this on first paint, so no flicker
        when HydrationGate takes over. P2-UAT test 4 fix.
      -->
      <div style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#F2F4F8;font-family:system-ui,sans-serif">
        <div style="text-align:center;animation:nova-boot-breathe 2.4s cubic-bezier(0.4,0,0.2,1) infinite">
          <div style="font-size:26px;font-weight:600;letter-spacing:0.32em;color:#161A22;padding-left:0.32em">NOVA</div>
        </div>
      </div>
      <style>
        @keyframes nova-boot-breathe {
          0%, 100% { opacity: 0.2; transform: scale(0.96); }
          50%      { opacity: 1;   transform: scale(1); }
        }
        @media (prefers-reduced-motion: reduce) {
          [style*="nova-boot-breathe"], div[style*="animation"] { animation: none !important; opacity: 0.6 !important; }
        }
      </style>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
