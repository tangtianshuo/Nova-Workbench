[package]
name = "nova_pm_workspace"
version = "0.1.0"
description = "Nova-PM-Workspace - Product & R&D Lifecycle Workspace"
authors = ["Brandon"]
edition = "2021"

[lib]
name = "nova_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-shell = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# --- Phase 3 additions ---
# ponytail: keyring v3 defaults to an in-memory MOCK backend if no platform
# feature is enabled — Entry::new() returns independent entries each call, so
# set_password succeeds but get_password on a fresh Entry returns NoEntry.
# Enable all three native backends so OS keychain actually persists.
keyring = { version = "3", features = ["apple-native", "windows-native", "linux-native"] }
rig-core = "0.41"
# ponytail: reqwest is a transitive dep of rig-core; declared explicitly so
# ping_provider can use it for provider REST probes. Default features give us
# native-tls (Windows schannel / macOS SecureTransport / Linux OpenSSL), which
# is fine for a desktop app.
reqwest = { version = "0.13", features = ["json"] }
# ponytail: futures is a transitive dep of rig-core but Cargo does not expose transitive
# deps to the dependent crate. Added explicitly so llm.rs and the spike example can call
# `futures::StreamExt::next` on StreamingCompletionResponse. Removed when rig re-exports it.
futures = "0.3"
tokio = { version = "1", features = ["full"] }
# ponytail: CancellationToken lives in tokio_util::sync, NOT tokio::sync (RESEARCH.md
# Open Question 2 — confirmed by cargo check Phase 3 Wave 1). tokio's "full" feature
# set does not re-export it. Only the `rt` feature of tokio-util is needed.
tokio-util = { version = "0.7", features = ["rt"] }
uuid = { version = "1", features = ["v4"] }
thiserror = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
